[package]
name = "mousewand"
description = "Mouse gestures for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mousewand-core.workspace = true
mousewand-input.workspace = true
mousewand-backend.workspace = true
mousewand-overlay.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
notify = "8"
signal-hook = "0.4"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
