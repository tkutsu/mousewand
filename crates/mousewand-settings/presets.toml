# Ready-made gestures, offered in the app's tab of mousewand-settings.
# Each preset uses the app's standard shortcuts.

[[preset]]
name = "Firefox"
classes = ["firefox", "librewolf", "zen", "floorp"]

[[preset.gesture]]
stroke = "L"
name = "Back"
action = { keys = "alt+Left" }

[[preset.gesture]]
stroke = "R"
name = "Forward"
action = { keys = "alt+Right" }

[[preset.gesture]]
stroke = "U"
name = "New tab"
action = { keys = "ctrl+t" }

[[preset.gesture]]
stroke = "DR"
name = "Close tab"
action = { keys = "ctrl+w" }

[[preset.gesture]]
stroke = "UL"
name = "Reopen closed tab"
action = { keys = "ctrl+shift+t" }

[[preset.gesture]]
stroke = "UD"
name = "Reload"
action = { keys = "F5" }

[[preset.gesture]]
wheel = "up"
name = "Previous tab"
action = { keys = "ctrl+shift+Tab" }

[[preset.gesture]]
wheel = "down"
name = "Next tab"
action = { keys = "ctrl+Tab" }

