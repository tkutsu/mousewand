# Each app's own shortcuts, offered first in the Do menu of its tab in
# mousewand-settings. All are the app's default keys.
#
# The common actions in ui/src/actions.ts follow these, so list only what
# they don't already cover. A shortcut named like a common action replaces
# it for that app: kitty's "Copy" is ctrl+shift+c, not ctrl+c.

# Browsers

[[app]]
name = "Firefox"
classes = ["firefox", "firefox-esr", "org.mozilla.firefox", "librewolf", "zen", "floorp"]
shortcuts = [
  { name = "Address bar", keys = "ctrl+l" },
  { name = "New window", keys = "ctrl+n" },
  { name = "New private window", keys = "ctrl+shift+p" },
  { name = "Close window", keys = "ctrl+shift+w" },
  { name = "Reload without cache", keys = "ctrl+shift+r" },
  { name = "Mute tab", keys = "ctrl+m" },
  { name = "Bookmark this page", keys = "ctrl+d" },
  { name = "Bookmarks sidebar", keys = "ctrl+b" },
  { name = "History sidebar", keys = "ctrl+h" },
  { name = "Downloads", keys = "ctrl+shift+y" },
  { name = "Reader view", keys = "ctrl+alt+r" },
  { name = "Print", keys = "ctrl+p" },
  { name = "Developer tools", keys = "ctrl+shift+i" },
]

[[app]]
name = "Chromium"
classes = ["chromium", "google-chrome", "brave-browser", "vivaldi-stable", "microsoft-edge"]
shortcuts = [
  { name = "Address bar", keys = "ctrl+l" },
  { name = "New window", keys = "ctrl+n" },
  { name = "New incognito window", keys = "ctrl+shift+n" },
  { name = "Close window", keys = "ctrl+shift+w" },
  { name = "Reload without cache", keys = "ctrl+shift+r" },
  { name = "Bookmark this page", keys = "ctrl+d" },
  { name = "Bookmarks bar", keys = "ctrl+shift+b" },
  { name = "History", keys = "ctrl+h" },
  { name = "Downloads", keys = "ctrl+j" },
  { name = "Print", keys = "ctrl+p" },
  { name = "Task manager", keys = "shift+Escape" },
  { name = "Developer tools", keys = "ctrl+shift+i" },
]

