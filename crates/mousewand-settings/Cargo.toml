[package]
name = "mousewand-settings"
description = "The settings app for mousewand"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Serve the built UI from the binary. Turn off to load the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mousewand-core.workspace = true
mousewand-input.workspace = true
serde.workspace = true
toml.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
toml_edit = "0.25"
