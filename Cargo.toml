[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkutsu/wisp"

[workspace.dependencies]
wisp-core = { path = "crates/wisp-core" }
wisp-input = { path = "crates/wisp-input" }
wisp-backend = { path = "crates/wisp-backend" }
wisp-overlay = { path = "crates/wisp-overlay" }

anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
