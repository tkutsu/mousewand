[workspace]
resolver = "3"
members = ["crates/*", "tools/shots"]
# mousewand-settings embeds its built web UI, so it builds on its own:
# pnpm -C crates/mousewand-settings/ui build, then cargo build -p mousewand-settings.
default-members = ["crates/mousewand-core", "crates/mousewand-input", "crates/mousewand-backend", "crates/mousewand-overlay", "crates/mousewand"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkutsu/mousewand"

[workspace.dependencies]
mousewand-core = { path = "crates/mousewand-core" }
mousewand-input = { path = "crates/mousewand-input" }
mousewand-backend = { path = "crates/mousewand-backend" }
mousewand-overlay = { path = "crates/mousewand-overlay" }

anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# A panicking thread must take the whole daemon down: the reader threads
# would otherwise keep the mice grabbed with nothing forwarding them.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
