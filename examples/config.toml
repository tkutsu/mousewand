# ~/.config/wisp/config.toml
# Every setting is optional; these are the defaults.

trigger = "middle"     # middle, side, extra, forward, back or task
threshold = 8          # motion before a press becomes a gesture (≈ px)
hold_ms = 300          # holding still this long makes it a normal press
min_segment = 30       # shorter strokes are ignored as noise
devices = []           # only grab mice whose name contains one of these
theme = "default"      # or a file in themes/, without .toml

# Global gestures, for every window. Per-app files in apps/ override them.
# Strokes: U D L R, plus diagonals as numpad digits: 7 ↖  9 ↗  1 ↙  3 ↘

[[gesture]]
stroke = "UD"
action = { command = "notify-send wisp \"gesture over $WISP_CLASS\"" }

# `dispatch` is passed to Hyprland as is. Lua-config Hyprland (0.55+)
# takes Lua dispatchers; older versions take e.g. "workspace e+1".
[[gesture]]
stroke = "RU"
action = { dispatch = 'hl.dsp.focus({ workspace = "e+1" })' }

[[gesture]]
stroke = "LU"
action = { dispatch = 'hl.dsp.focus({ workspace = "e-1" })' }

# A real alt-tab: alt goes down when "9" (↗) is recognized, every 80 px
# further up-right taps tab, and releasing the trigger lets go of alt.
[[gesture]]
stroke = "9"
kind = "hold"
hold = "alt"
action = { keys = "Tab" }

# Trigger + wheel: volume.
[[gesture]]
wheel = "up"
action = { command = "wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+" }

[[gesture]]
wheel = "down"
action = { command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-" }
