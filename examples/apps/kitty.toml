[[gesture]]
stroke = "L"
name = "Previous tab"
action = { keys = "ctrl+shift+Left" }

[[gesture]]
stroke = "R"
name = "Next tab"
action = { keys = "ctrl+shift+Right" }

[[gesture]]
stroke = "U"
name = "New tab"
action = { keys = "ctrl+shift+t" }

[[gesture]]
stroke = "DR"
name = "Close tab"
action = { keys = "ctrl+shift+q" }
